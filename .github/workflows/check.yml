name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check skill
        run: python3 scripts/check-skill.py
      - name: Test the skill checker
        run: python3 -B -m unittest discover -s tests -v

  lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Prove every lint in lints/lints.toml fires
        run: bash scripts/check-lints.sh
